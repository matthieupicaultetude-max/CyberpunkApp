<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">ALL FOODS — plateau Maelstrom</title><desc id="desc">Usine alimentaire suspecte contrôlée par le Maelstrom. Chaîne de production, cuves, maintenance, chambre froide pour cadavres humains, tri et expédition vers les Scavengers.</desc><defs><pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="#322b2d" stroke-width="1"/></pattern></defs><rect width="1600" height="1100" fill="#101014"/><rect width="1600" height="1100" fill="url(#grid)"/><text x="70" y="72" fill="#ec826b" font-family="Arial,sans-serif" font-size="43" letter-spacing="9">ALL FOODS</text><text x="72" y="107" fill="#b8aaa7" font-family="monospace" font-size="15" letter-spacing="2">NORTHSIDE / USINE OCCUPÉE / LOGISTIQUE CLANDESTINE</text><text x="1530" y="72" text-anchor="end" fill="#ec826b" font-family="monospace" font-size="16">MAELSTROM</text><path d="M70 130H1530M70 1025H1530" stroke="#67483f"/><g><rect x="100" y="180" width="330" height="230" rx="3" fill="#e68a76" fill-opacity=".055" stroke="#e68a76" stroke-width="3"/><text x="118" y="208" fill="#e68a76" font-family="monospace" font-size="14">01</text><text x="118" y="236" fill="#f0e6df" font-family="Arial,sans-serif" font-size="19" letter-spacing="1">RÉCEPTION / GARDE</text><text x="118" y="262" fill="#b4a4a2" font-family="Arial,sans-serif" font-size="14">Accès sous contrôle du gang</text></g><g><rect x="470" y="180" width="610" height="370" rx="3" fill="#e68a76" fill-opacity=".055" stroke="#e68a76" stroke-width="3"/><text x="488" y="208" fill="#e68a76" font-family="monospace" font-size="14">02</text><text x="488" y="236" fill="#f0e6df" font-family="Arial,sans-serif" font-size="19" letter-spacing="1">CHAÎNE ALIMENTAIRE</text><text x="488" y="262" fill="#b4a4a2" font-family="Arial,sans-serif" font-size="14">Convoyeurs et production suspecte</text></